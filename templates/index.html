<!-- prettier-ignore -->
{% extends "layout.html" %}

{% block body %}

<form method="post" action="/register">
  <input
    type="text"
    autofocus
    autocomplete="off"
    name="name"
    placeholder="Name"
  />
  {% for sport in sports %}
  <input type="radio" name="sport" value="{{ sport }}" /> {{ sport }} {% endfor
  %}
  <button type="submit">Greet</button>
</form>

{% endblock %}
